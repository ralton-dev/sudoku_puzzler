# Weekly dependency updates for the pnpm workspace + GitHub Actions.
# Vulnerability alerts and security-only updates are configured at the repo
# level (decision 15; applied by the human, never by an agent).
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: 'Europe/London'
    open-pull-requests-limit: 5
    labels: ['dependencies']
    groups:
      # Group minor + patch bumps to reduce noise; majors stay individual.
      minor-and-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: 'Europe/London'
    open-pull-requests-limit: 5
    labels: ['dependencies', 'ci']
  # One container only: the single Fastify process that also serves the client
  # (decision 7). WP-G lands apps/web/Dockerfile.
  - package-ecosystem: docker
    directory: '/apps/web'
    schedule:
      interval: weekly
    labels: ['dependencies', 'docker']
