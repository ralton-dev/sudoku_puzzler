# Job names are contracts: branch protection on `main` lists `check` and the two
# `docker (linux/…)` matrix legs as required status contexts (decision 15).
# Nobody renames them, and a new job needs the human to add a new context — which
# is why the e2e lives inside `check` rather than in a job of its own, and why
# `docker-merge` is deliberately NOT required (it only runs on push to `main`, so
# on a pull request it would never report and every PR would sit there blocked).
name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm 11, pinned by the root package.json `packageManager` field.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser binary is ~150 MB and never changes between runs that have
      # the same lockfile. The system libraries it needs are not cached, so
      # `--with-deps` still runs below; on a cache hit it is the only work done.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      # lint -> typecheck -> test -> build, in that order.
      - name: Check
        run: pnpm check

      # The e2e is part of the gate, not a separate context: it builds the
      # server and the client, boots two of them on temp databases and drives a
      # real browser through a real generated puzzle.
      - name: End-to-end
        run: pnpm --filter web e2e

      # Both paths: the HTML report, and `test-results/` for the traces and the
      # failure screenshots it links to.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 7

  # Build each architecture on its NATIVE runner — emulated (QEMU) arm64 builds
  # of the vite/esbuild bundles are slow enough to be a problem on their own, and
  # a native module compiled under emulation proves nothing about the real thing.
  # Each leg pushes by digest only; `docker-merge` then assembles the manifest
  # list. `ubuntu-24.04-arm` is free for public repos.
  docker:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    # arm64 builds run on the in-cluster self-hosted runner (homelab-arm64) ONLY
    # on push-to-main (fork PRs fire pull_request and run the base workflow, so
    # they never select it); arm64 on PRs falls back to GitHub's hosted arm
    # runner; amd64 always uses ubuntu-latest.
    runs-on: ${{ (matrix.platform == 'linux/arm64' && github.event_name == 'push' && github.ref == 'refs/heads/main') && 'homelab-arm64' || (matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Prepare platform tag
        id: prep
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On PRs this builds (verify-only) without pushing. On main it pushes the
      # single-platform image by digest (no tag yet) for the merge step.
      - name: Build (push by digest on main)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/sudoku-puzzler,push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=${{ steps.prep.outputs.pair }}
          cache-to: type=gha,scope=${{ steps.prep.outputs.pair }},mode=max

      # A registry image is not a local image: the step above hands the layers to
      # buildkit, not to the docker daemon, so there is nothing to `docker run`.
      # This re-exports the same build through the docker exporter — every layer
      # is a cache hit, so it costs the export and nothing else — and it is why
      # the platform stays single here: `--load` takes exactly one.
      - name: Load the image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: sudoku-puzzler:ci
          cache-from: type=gha,scope=${{ steps.prep.outputs.pair }}

      # Building proves it compiles; this proves it runs, on this architecture.
      # better-sqlite3 is a native module and the runtime stage has no compiler,
      # so "the image boots and can write to /data" is exactly the thing a build
      # alone would not catch — and it is the reason the smoke runs on every leg
      # rather than once on amd64.
      - name: Boot it and play one hand
        run: |
          set -euo pipefail
          docker run --detach --name sudoku-ci --publish 8080:8080 \
            --env APP_VERSION="sha-${GITHUB_SHA}" sudoku-puzzler:ci
          # `/readyz` is the wait, here and in the Dockerfile HEALTHCHECK and in
          # the cluster: it is 503 until the volume is mounted and the schema is
          # migrated, which is exactly the condition the next three lines need.
          for _ in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8080/readyz; then break; fi
            sleep 1
          done
          echo "GET /healthz: $(curl --silent http://127.0.0.1:8080/healthz)"
          ready=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/readyz)
          empty=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/game)
          created=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' \
            --data '{"level":"medium"}' http://127.0.0.1:8080/api/game)
          echo "GET /readyz:                    $ready (want 200)"
          echo "GET /api/game on a fresh volume: $empty (want 204)"
          echo "POST /api/game {level:medium}:  $created (want 201)"
          test "$ready" = "200"
          test "$empty" = "204"
          test "$created" = "201"

      - name: Container logs
        if: always()
        run: docker logs sudoku-ci || true

      - name: Stop it
        if: always()
        run: docker rm --force sudoku-ci || true

      - name: Export digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ steps.prep.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble + push the multi-arch manifest list from the per-platform digests.
  # Tags: sha-<full-commit-sha> + :latest. Push-to-main only, so this is not a
  # required status context — see the note at the top of the file.
  docker-merge:
    name: docker-merge
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/sudoku-puzzler
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Create + push manifest list
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # intentional split: -t flags + digest refs
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/sudoku-puzzler@sha256:%s ' *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/sudoku-puzzler:${{ steps.meta.outputs.version }}
