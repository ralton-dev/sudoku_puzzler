<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A quiet sudoku board, and fourteen techniques to learn." />
    <!-- The tab colour follows the page: `--paper` in each scheme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eff2f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15181c" />
    <!--
      One drawing, four files. `mark.svg` is the source and the only thing to
      edit; the raster set beside it is rendered from it by
      `scripts/render-icons.mjs`. The .ico is the fallback for browsers that
      still will not take an SVG icon.
    -->
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <link rel="icon" sizes="32x32" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Sudoku Puzzler</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
