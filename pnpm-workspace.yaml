packages:
  - 'packages/*'
  - 'apps/*'

# pnpm 10 stopped running dependency lifecycle scripts unless they are named
# here, and pnpm 11 fails the install until each one is decided. Both of these
# genuinely need theirs: better-sqlite3 is a native module whose install script
# fetches (or, failing that, compiles) `better_sqlite3.node`, and esbuild's
# fetches its platform binary. Without them the server cannot open the database
# and the client cannot be built. Nothing else in the tree runs a build script.
allowBuilds:
  better-sqlite3: true
  esbuild: true

# GHSA-fc5q-39xc-vjpf (picomatch ReDoS, high) covers every picomatch release (<= 4.0.7) and
# has no fixed version (advisory widened 2026-11-17). picomatch is reached only through
# dev and build tooling (vitest; vite and @vitejs/plugin-react; typescript-eslint >
# tinyglobby) matching the repo's own globs, and `pnpm audit --prod` is clean. Remove
# this once a fixed picomatch is released.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
